<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>CoolSys</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="js/tools.js"></script>
        <script src="js/users.js"></script>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/popup.css">
        <link rel="stylesheet" href="css/search.css">

        <script>
            $(document).ready(function () {
                $("#header").load('header.html');
                $('#footer').load('footer.html');
            });
        </script>
    </head>

    <div id="header"></div>

    <div class="row">
        
        <!-- CREATE CONTAINER -->
        <div class="col-6 container rounded" style="margin: 20px; margin-left: 30px; background-color:#b8e5ff !important;">
                
            <h1 class="display-6">Register New Tool</h1>
            <form action="createtool" method="post">

                <div class="row" style="margin: 10px" >
                    <div class="col-4 justify-content-end">
                        <label for="serial" class="form-label">Serial Number</label>
                    </div>
        
                    <div class="col-auto">
                        <input type="text" class="form-control" id="serial" name="serial" placeholder="..." required>
                    </div>
                </div>

                <div class="row " style="margin: 10px">
                    <div class="col-4 justify-content-end">
                        <label for="model" class="form-label">Model</label>
                        
                    </div>
        
                    <div class="col-auto">
                        <input type="text" class="form-control" id="model" name="model" placeholder="..." required>
                    </div>
                </div>

                <div class="row">
                    <div class="text-center" style="margin: 10px">
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </div>
                
            </form>
        </div>
        <!-- CREATE CONTAINER END -->

        <!-- ADD USER CONTAINER -->
        <div class="col-4 ms-auto container rounded" style="margin: 20px; margin-right: 30px; background-color:#b8e5ff !important;">

            <h2 class="display-6">Add User to Tool</h2>
            <form id="addtooltouser" action="updatetool" method="post" onsubmit="addUserToTool(event)">

                <!-- <div class="row" style="margin: 10px" >
                    <div class="col-4 justify-content-end">
                        <label for="serial2" class="form-label">Serial Number</label>
                    </div>
        
                    <div class="col-auto">
                        <input type="text" class="form-control" id="serial2" name="serial2" placeholder="..." required>
                    </div>
                </div> -->

                <div class="input-group mb-3" style="justify-content: center;">
                    <div class="input-group-prepend">
                    <label class="input-group-text" for="toolsdropdown2">Tools</label>
                    </div>
                    <select class="custom-select" id="toolsdropdown2" name = "toolsdropdown2"required>
                    <option value = "" selected>Choose...</option>
                    </select>
                </div>

                <div class="input-group mb-3" style="justify-content: center;">
                    <div class="input-group-prepend">
                      <label class="input-group-text" for="usersdropdown">Users</label>
                    </div>
                    <select class="custom-select"  id="usersdropdown" required>
                      <option value = "" selected>Choose...</option>
                    </select>
                </div>

                <div class="text-center"style="margin: 10px">
                    <button type="submit" class="btn btn-secondary">Update Tool</button>
                </div>
            </form>

        </div>
        <!-- ADD USER CONTAINER END -->

    </div>

    <!-- SEARCH FOR TOOL -->
    <div class="container center rounded" style="background-color:#b8e5ff !important; margin-bottom: 20px">
        <h1 class="display-6">Search for Tool</h1>

        <div class="row">
            <div class="search-select-wrapper">
                <input type="text" class="form-control" id="toolSearch" placeholder="Search by serial number" autocomplete="off" required
                    oninput="filterList('toolSearch','toolList',allTools,'serialNum',selectRecip)"
                    onfocus="openList('toolList')" onblur="closeListDelayed('toolList')">
                <ul class="search-dropdown-list" id="toolList"></ul>
            </div>
            <span class="selected-badge" id="toolBadge" style="display:none;"></span>
            <input type="hidden" id="selectedToolId">

            <div class="text-center" style="margin: 5px">
                <button class="btn btn-info" onclick="openPopup(event)">Open Popup</button>
                <button class="btn btn-outline-secondary ms-2" onclick="clearToolSearch()">Clear</button>
            </div>
        </div>

    </div>


        <!-- <div class="container">
            <div class="row">
              <div class="col-md-6" id="msg-display">
                    Error messages will be dynamically displayed here 
              </div>
            </div>
         </div>  -->

        <!-- <div class="container text-center">

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">Serial Number</th>
                        <th scope="col">Model</th>
                        <th scope="col">In Use?</th>
                        <th scope="col">Action(s)</th>
                    </tr>
                </thead>

                <tbody id="toolTableBody">

                </tbody>

            </table>
        </div> -->

        <div class="container">
            <div class="popup" id="popup"></div>
        </div>

        <div class="container-sm center rounded" style="background-color:#b8e5ff !important;">
            <h1 class="display-6">Update Tool</h1>
            <form id="updateform" action="updatetool" method="post" onsubmit="updateTool(event)">

                <div class="row">

                    <div class="input-group mb-3" style="justify-content: center;">
                        <div class="input-group-prepend">
                        <label class="input-group-text" for="toolsdropdown">Options</label>
                        </div>
                        <select class="custom-select" id="toolsdropdown" name = "toolsdropdown"required>
                        <option value = "" selected>Choose...</option>
                        </select>
                    </div>

                </div>
                
                <div class="row">

                    <div class="col">
                        <div class="input-group mb-3">
                            <div style="margin: 10px">
                                <label for="updateserial" class="form-label">New Serial Number</label>
                                <input type="text" class="form-control" id="updateserial" name="updateserial" placeholder="..." required>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="input-group mb-3">
                            <div style="margin: 10px">
                                <label for="updatemodel" class="form-label">New Model</label>
                                <input type="text" class="form-control" id="updatemodel" name="updatemodel" placeholder="..." required>
                            </div>
                        </div>
                    </div>

                </div>
                
                <div class="text-center"style="margin: 10px">
                    <button type="submit" class="btn btn-secondary">Update Tool</button>
                </div>
            </form>

        </div>

        

        


        <div id="footer"></div>
        
        <script type="text/javascript">
            const params = new URLSearchParams(window.location.search);    
            let error = params.get('error');
            let msg = null;
            if(error === '1'){
                msg = `
                    <div class="alert alert-danger alert-dismissible">
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        <strong>Error!</strong> Password and Confirm Password must match.
                    </div>
                `;
                document.getElementById("msg-display").innerHTML = msg;
            } 
        </script>

    
</html>
