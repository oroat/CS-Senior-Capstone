<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>CoolSys</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <!-- <script src="js/tools.js"></script>
        <script src="js/users.js"></script> -->
        <script src="js/profile.js"></script>
        <link rel="stylesheet" href="css/main.css">
    </head>


    <script>
        $(document).ready(function () {
            $("#header").load('header.html');
            $('#footer').load('footer.html');
        });
    </script>


    <div id="header"></div>

    <body style="background-color: #ade0ff;">

        <div class="col-4 text-center">
            <h1 class="display-3">Profile page</h1>
        </div>
        
    
        <div class="col-3 container rounded text-center mx-auto">
    
            <h2 id="name&role">Name, Role</h2>
    
        </div>
    
        <div class="row container justify-content-evenly">
            <div class="col-4" style="margin: 10px">
    
                
                <h1 class="display-6 text-center">My Tools</h1>
    
                <table class="table table-info table-striped">
    
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Type</th>
                            <th scope="col">Serial #</th>
                            <th scope="col">Buttons</th>
                              
                        </tr>
                        </thead>
                        <tbody id="toolTableBody">
                          <!-- EXAMPLE TABLE INPUT -->
                          <tr>
                            <th scope="row">1</th>
                            <td>Mark</td>
                            <td>Otto</td>
                            <td style="place-items: center">
                                <button type="button" class="btn btn-warning" onclick="getProjects()">Warning</button>
                            </td>
                          </tr>

                        </tbody>
    
                    </table>
                </div>
                
    
                <div class="col-6 container rounded " style="margin: 20px; margin-right: 30px; background-color: orange;">
                    <h1 class="display-6 text-center">My Projects</h1>
    
                    <table class="table table-striped table-warning">
    
                        <thead>
                            <tr>
                              <th scope="col">#</th>
                              <th scope="col">Name</th>
                              <th scope="col">Location</th>
                              <th scope="col">Managers</th>
                              
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <th scope="row">1</th>
                              <td>Name 1</td>
                              <td>Location 1</td>
                              <td>Manager 1, Manager 2</td>
                            </tr>
                            <tr>
                              <th scope="row">2</th>
                              <td>Name 2</td>
                              <td>Location 2</td>
                              <td>Manager 3, Manager 4</td>
                            </tr>
                            <tr>
                              <th scope="row">3</th>
                              <td>Name 3</td>
                              <td>Location 3</td>
                              <td>Manager 5, Manager 6</td>
                            </tr>
                          </tbody>
    
                    </table>
                </div>
    
            </div>

    </body>
        
    
    <div id="footer"></div>

    <script>
      

    </script>

</html>
