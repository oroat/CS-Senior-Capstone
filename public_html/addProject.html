<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Add Project - CoolSys</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    </head>
    <body>

        <div id="header"></div>

        <h2>Create New Project</h2>

        <form id="projectForm">
            <div class="form mb-3">
                <input type="text" id="name" name="name" placeholder="Project Name" required>
                <label for="name">Project Name</label>
            </div>

            <div class="form mb-3">
                <input type="text" id="location" name="location" placeholder="Location" required>
                <label for="location">Location</label>
            </div>

            <div class="form mb-3">
                <label for="manager">Project Manager</label><br>
                <select id="manager" name="manager" required>
                    <option value="">-- Select a Manager --</option>
                </select>
            </div>

            <div class="form mb-3">
                <label for="workers">Assign Workers (Hold Ctrl/Cmd)</label><br>
                <select id="workers" name="workers" multiple style="min-width: 200px; height: 100px;">
                </select>
            </div>

            <div class="text-center">
                <button type="submit">Create Project</button>
            </div>
        </form>

        <hr>

        <h3>All Projects</h3>
        <div id="projectList"></div>

        <div id="footer"></div>

        <script src="js/projects.js"></script>

        <script>
            $(document).ready(function () {
                $("#header").load('header.html');
                $('#footer').load('footer.html');
            });
        </script>

    </body>
</html>
