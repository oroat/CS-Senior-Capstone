<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Project - CoolSys</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="header"></div>

    <div class=" col-4 container rounded" style="margin: 20px; margin-left: 30px; background-color:#b8e5ff !important;">
        <h2>Edit Project</h2>

    <form id="editProjectForm">

        <div>
            <input type="text" id="name" required>
            <label for="name">Project Name</label>
        </div>

        <div>
            <input type="text" id="location" required>
            <label for="location">Location</label>
        </div>

        <div>
            <label for="manager">Manager</label><br>
            <select id="manager" required>
                <option value="">-- Select a Manager --</option>
            </select>
        </div>

        <div>
            <label for="workers">Workers (Hold Ctrl/Cmd to select multiple)</label><br>
            <select id="workers" multiple style="min-width: 200px; height: 100px;">
                </select>
        </div>

        <button class='btn btn-primary'type="submit">Update Project</button>
        <button class='btn btn-warning'type="button" onclick="window.location.href='/addProject'">Cancel</button>

    </form>
    </div>
    

    <script src="js/editProject.js"></script>

    <script>
        $(document).ready(function () {
            $("#header").load('header.html');
        });
    </script>

</body>
</html>
