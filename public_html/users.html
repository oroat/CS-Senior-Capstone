<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>CoolSys</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="js/users.js"></script>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/popup.css">
        <link rel="stylesheet" href="css/search.css">
    </head>

    <div id="header"></div>

    <div class="row">

        <!-- REGISTER CONTAINER -->
        <div class="col-6 container rounded" style="margin: 20px; margin-left: 30px; background-color:#b8e5ff !important;">
                
            <h1 class="display-6">Register New User</h1>
            <form action="registeruser" method="post">

                <div class="row" style="margin: 10px" >
                    <div class="col-4 justify-content-end">
                        <label for="name" class="col-form-label">First and Last Name</label>
                    </div>
        
                    <div class="col-auto">
                        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="row " style="margin: 10px">
                    <div class="col-4 justify-content-end">
                        <label for="email" class="col-form-label">Email address</label>
                    </div>
        
                    <div class="col-auto">
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="row " style="margin: 10px">
                    <div class="col-4 justify-content-end">
                        <label for="pass" class="col-form-label">Password</label>
                    </div>
        
                    <div class="col-auto">
                        <input type="password" class="form-control" id="pass" name="pass" placeholder="password" required>
                    </div>
                </div>
            
                <div class="row " style="margin: 10px">
                    <div class="col-4 justify-content-end">
                        <label for="confirm_pass" class="col-form-label">Confirm Password</label>
                    </div>
        
                    <div class="col-auto">
                        <input type="password" class="form-control justify-content-end" id="confirm_pass" name="confirm_pass" placeholder="..." required>
                    </div>
                </div>
    

                <div class="row">
                    <div class="text-center" style="margin: 10px">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                </div>
                
            </form>
        </div>
        <!-- REGISTER CONTAINER END -->

        <!-- UPDATE CONTAINER -->
        
            <div class="col-4 ms-auto container rounded" style="margin: 20px; margin-right: 30px; background-color:#b8e5ff !important;">
                <h1 class="display-6">Update User Role</h1>
        
                <form id="updateform" action="updaterole" method="post" onsubmit="updateRole(event)">
        
                    <div class="row" style="margin: 10px">
                        <div class="col-4 text-end align-self-start">
                            <label class="col-form-label" for="usersdropdown">User</label>
                        </div>
        
                        <div class="col-auto align-self-start">
                            <select class="form-select" name = "usersdropdown" id="usersdropdown" required>
                                <option value = "" selected>Choose...</option>
                            </select>
                        </div>
                    </div>
        
                    <div class="row" style="margin: 10px">
                        <div class="col-4 text-end">
                            <label class="col-form-label" for="rolesdropdown">Role</label>
                        </div>
        
                        <div class="col-auto">
                            <select class="form-select" name="rolesdropdown" id="rolesdropdown" required>
                                <option value = "" selected>Choose...</option>
                                <option value="0">Admin</option>
                                <option value="1">Project Manager</option>
                                <option value="2">Foreman</option>
                                <option value="3">Logistics</option>
                                <option value="4">Warehouse</option>
                            </select>
                        </div>
                    </div>

                    <!-- onclick="updateRole()" -->
                    <div class="row">
                        <div class=" text-center" style="margin: 10px">
                            <button type="submit"  class="btn btn-secondary">Update Role</button>
                        </div>
                    </div>
                    
                </form>
            </div>

        <!-- UPDATE CONTAINER END -->   

    </div>

        <div class="container">
            <div class="row">
              <div class="col-md-6" id="msg-display">
                  <!-- Error messages will be dynamically displayed here -->
              </div>
            </div>
        </div>

        <div class="container center rounded" style="background-color:#b8e5ff !important; margin-bottom: 20px">
            <h1 class="display-6">Search for User</h1>
    
            <div class="row">
                <div class="search-select-wrapper">
                    <input type="text" class="form-control" id="userSearch" placeholder="Search by email" autocomplete="off"
                        oninput="filterList('userSearch','userList',allUsers,'email',selectUser)"
                        onfocus="openList('userList')" onblur="closeListDelayed('userList')">
                    <ul class="search-dropdown-list" id="userList"></ul>
                </div>
                <span class="selected-badge" id="userBadge" style="display:none;"></span>
                <input type="hidden" id="selectedUserId">
    
                <div class="text-center" style="margin: 5px">
                    <button class="btn btn-info" onclick="openPopup(event)">Open Popup</button>
                    <button class="btn btn-outline-secondary ms-2" onclick="clearUserSearch()">Clear</button>
                </div>
            </div>
    
        </div>

        <div class="container">
            <div class="popup" id="popup"></div>
        </div>
        
        
        <div id="footer"></div>

    <script>

        const params = new URLSearchParams(window.location.search);    
            let error = params.get('error');
            let msg = null;
            if(error === '1'){
                msg = `
                    <div class="alert alert-danger alert-dismissible">
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        <strong>Error!</strong> Password and Confirm Password must match.
                    </div>
                `;
                document.getElementById("msg-display").innerHTML = msg;
            } 

            else if(error === '2'){
                msg = `
                    <div class="alert alert-danger alert-dismissible">
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        <strong>Error!</strong> An account already exists with that email.
                    </div>
                `;
                document.getElementById("msg-display").innerHTML = msg;
            } 

            else if (error === '3'){
                msg = `
                    <div style="display: flex; justify-content: flex-end;">
                        <div class="alert alert-danger alert-dismissible">
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            Error updating account.
                        </div>
                    </div>
                `;
                document.getElementById("msg-display").innerHTML = msg;
            }
    </script>

    <script>
        $(document).ready(function () {
            $("#header").load('header.html');
            $('#footer').load('footer.html');
        });
    </script>

    
    
</html>
