<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Project - CoolSys</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #b8e5ff;
            --sky-dark: #7ecff5;
            --sky-deep: #3aa8e8;
            --ink: #1a2a3a;
            --muted: #5a7a8a;
            --white: #ffffff;
            --card-bg: #f0f9ff;
            --accent: #0077b6;
            --shadow: 0 8px 32px rgba(0,119,182,0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #e8f7ff 0%, #cceeff 60%, #b8e5ff 100%);
            min-height: 100vh;
            color: var(--ink);
        }

        .top-bar {
            background: var(--white);
            border-bottom: 2px solid var(--sky);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(0,119,182,0.08);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sky);
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            text-decoration: none;
        }
        .back-btn:hover { background: var(--sky-dark); transform: translateX(-3px); }

        .top-bar-title {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: var(--accent);
        }

        .page-wrapper {
            max-width: 860px;
            margin: 48px auto;
            padding: 0 24px 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* ── Shared card shell ── */
        .card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1.5px solid var(--sky-dark);
        }

        /* ── Project banner ── */
        .project-banner {
            background: linear-gradient(120deg, var(--accent) 0%, #00b4d8 100%);
            padding: 36px 40px 28px;
            position: relative;
            overflow: hidden;
        }
        .project-banner::before {
            content: '';
            position: absolute;
            right: -40px; top: -40px;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }

        .project-id-tag {
            display: inline-block;
            background: rgba(255,255,255,0.18);
            color: #d0f0ff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .project-name-display {
            font-family: 'DM Serif Display', serif;
            font-size: 36px;
            color: var(--white);
            line-height: 1.15;
        }

        .project-body { padding: 36px 40px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--sky-deep);
            margin-bottom: 20px;
        }

        .attr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 8px;
        }

        .attr-card {
            background: var(--card-bg);
            border: 1.5px solid var(--sky);
            border-radius: 12px;
            padding: 18px 22px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .attr-card:hover { box-shadow: 0 4px 18px rgba(0,119,182,0.10); border-color: var(--sky-dark); }
        .attr-card.full { grid-column: 1 / -1; }

        .attr-icon { font-size: 20px; margin-bottom: 6px; }
        .attr-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
        .attr-value { font-size: 17px; font-weight: 600; color: var(--ink); }
        .attr-value.empty { font-style: italic; color: var(--muted); font-weight: 400; font-size: 15px; }

        .workers-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
        .worker-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            border: 1.5px solid var(--sky-dark);
            border-radius: 24px;
            padding: 6px 14px 6px 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
        }
        .worker-avatar {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sky-deep), var(--accent));
            color: white;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            padding: 28px 40px 36px;
            border-top: 1.5px solid var(--sky);
        }
        .action-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: filter 0.2s, transform 0.15s;
        }
        .action-btn:hover { filter: brightness(0.92); transform: translateY(-2px); }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-back-main { background: var(--accent); color: var(--white); }

        /* ── Purchase Orders section ── */
        .po-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px 0;
        }

        .po-section-title {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--ink);
        }

        .po-count-badge {
            background: var(--sky);
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .po-list { padding: 20px 32px 32px; display: flex; flex-direction: column; gap: 14px; }

        .po-card {
            background: var(--card-bg);
            border: 1.5px solid var(--sky);
            border-radius: 12px;
            padding: 18px 22px;
            transition: box-shadow 0.2s;
        }
        .po-card:hover { box-shadow: 0 4px 16px rgba(0,119,182,0.10); }

        .po-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .po-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
        }

        .po-vendor {
            font-size: 14px;
            color: var(--muted);
        }

        /* Status badges — match your existing badge colors */
        .po-status {
            margin-left: auto;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            color: #fff;
        }
        .status-Draft           { background: #6c757d; }
        .status-Pending         { background: #ffc107; color: #333; }
        .status-Approved        { background: #28a745; }
        .status-Received        { background: #17a2b8; }
        .status-Verified        { background: #20c997; }
        .status-Cancelled       { background: #dc3545; }
        .status-Missing-Materials { background: #dc3545; }

        .po-materials {
            list-style: none;
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .po-mat-chip {
            background: var(--white);
            border: 1px solid var(--sky-dark);
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 13px;
            color: var(--ink);
        }

        .po-notes {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
            font-style: italic;
        }

        .po-empty {
            text-align: center;
            padding: 28px;
            color: var(--muted);
            font-style: italic;
        }

        /* ── States ── */
        .state-message { text-align: center; padding: 80px 40px; }
        .state-message .icon { font-size: 56px; margin-bottom: 16px; }
        .state-message h2 { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--ink); margin-bottom: 8px; }
        .state-message p { color: var(--muted); font-size: 15px; }

        @media (max-width: 600px) {
            .attr-grid { grid-template-columns: 1fr; }
            .project-banner { padding: 28px 24px; }
            .project-body { padding: 28px 24px; }
            .action-bar { flex-direction: column; padding: 24px; }
            .project-name-display { font-size: 28px; }
            .po-section-header { padding: 20px 20px 0; }
            .po-list { padding: 16px 20px 24px; }
        }
    </style>
</head>
<body>

<div id="header"></div>

<div class="top-bar">
    <a class="back-btn" href="javascript:history.back()">← Back</a>
    <span class="top-bar-title">Project Details</span>
</div>

<div class="page-wrapper">

    <!-- Project detail card -->
    <div class="card" id="projectHero">
        <div class="state-message">
            <div class="icon">⏳</div>
            <h2>Loading project...</h2>
            <p>Fetching project details, please wait.</p>
        </div>
    </div>

    <!-- Purchase Orders card -->
    <div class="card" id="poCard" style="display:none;">
        <div class="po-section-header">
            <span class="po-section-title">📋 Purchase Orders</span>
            <span class="po-count-badge" id="poCountBadge">0</span>
        </div>
        <div class="po-list" id="poList"></div>
    </div>

</div>

<script>
    $(document).ready(function () {
        $("#header").load('header.html');
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    function initials(name) {
        if (!name) return '?';
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function renderWorkers(workers) {
        if (!workers || workers.length === 0) {
            return '<span class="attr-value empty">No workers assigned</span>';
        }
        return '<div class="workers-list">' +
            workers.map(w => `
                <div class="worker-chip">
                    <div class="worker-avatar">${initials(w.name)}</div>
                    ${w.name}
                </div>`
            ).join('') +
        '</div>';
    }

    function renderProject(project) {
        const managerName = project.manager ? project.manager.name : 'N/A';
        const projectId   = project._id;

        document.getElementById('projectHero').innerHTML = `
            <div class="project-banner">
                <div class="project-id-tag">ID: ${projectId}</div>
                <div class="project-name-display">${project.name}</div>
            </div>

            <div class="project-body">
                <div class="section-label">Project Details</div>
                <div class="attr-grid">
                    <div class="attr-card">
                        <div class="attr-icon">📍</div>
                        <div class="attr-label">Location</div>
                        <div class="attr-value ${!project.location ? 'empty' : ''}">
                            ${project.location || 'Not specified'}
                        </div>
                    </div>
                    <div class="attr-card">
                        <div class="attr-icon">👤</div>
                        <div class="attr-label">Project Manager</div>
                        <div class="attr-value ${!project.manager ? 'empty' : ''}">
                            ${managerName}
                        </div>
                    </div>
                    <div class="attr-card full">
                        <div class="attr-icon">👷</div>
                        <div class="attr-label">Assigned Workers (${(project.workers || []).length})</div>
                        ${renderWorkers(project.workers)}
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button class="action-btn btn-edit"
                    onclick="window.location.href='editProject.html?id=${projectId}'">
                    ✏️ Edit Project
                </button>
                <button class="action-btn btn-back-main" onclick="history.back()">
                    ← Back
                </button>
            </div>`;
    }

    function renderPurchaseOrders(orders, projectId) {
        const poCard  = document.getElementById('poCard');
        const poList  = document.getElementById('poList');
        const poBadge = document.getElementById('poCountBadge');

        // Filter to only POs belonging to this project
        const projectPOs = orders.filter(po =>
            po.project && (po.project._id === projectId || po.project === projectId)
        );

        poBadge.textContent = projectPOs.length;
        poCard.style.display = 'block';

        if (projectPOs.length === 0) {
            poList.innerHTML = '<div class="po-empty">No purchase orders linked to this project yet.</div>';
            return;
        }

        poList.innerHTML = projectPOs.map(po => {
            const statusClass = 'status-' + (po.status || 'Draft').replace(/\s+/g, '-');
            const matChips = po.materials && po.materials.length > 0
                ? po.materials.map(m =>
                    `<li class="po-mat-chip">${m.name} — ${m.quantity} ${m.unit}</li>`
                  ).join('')
                : '<li class="po-mat-chip" style="color:#aaa;">No materials</li>';

            const notesHtml = po.notes
                ? `<div class="po-notes">📝 ${po.notes}</div>`
                : '';

            return `
                <div class="po-card">
                    <div class="po-card-header">
                        <span class="po-number">${po.poNumber}</span>
                        <span class="po-vendor">· ${po.vendor}</span>
                        <span class="po-status ${statusClass}">${po.status}</span>
                    </div>
                    <ul class="po-materials">${matChips}</ul>
                    ${notesHtml}
                </div>`;
        }).join('');
    }

    // ── Load everything ───────────────────────────────────────────────────────

    async function loadProject() {
        const params    = new URLSearchParams(window.location.search);
        const projectId = params.get('id');

        if (!projectId) {
            document.getElementById('projectHero').innerHTML = `
                <div class="state-message">
                    <div class="icon">❓</div>
                    <h2>No Project Selected</h2>
                    <p>Please go back and select a project to view.</p>
                </div>`;
            return;
        }

        try {
            // Fetch project and all POs in parallel
            const [projectRes, ordersRes] = await Promise.all([
                fetch(`/projects/${projectId}`),
                fetch('/purchaseorders')
            ]);

            if (!projectRes.ok) throw new Error(`Server returned ${projectRes.status}`);

            const project = await projectRes.json();
            const orders  = ordersRes.ok ? await ordersRes.json() : [];

            renderProject(project);
            renderPurchaseOrders(orders, projectId);

        } catch (err) {
            document.getElementById('projectHero').innerHTML = `
                <div class="state-message">
                    <div class="icon">❌</div>
                    <h2>Failed to Load Project</h2>
                    <p>${err.message}</p>
                </div>`;
        }
    }

    loadProject();
</script>

</body>
</html>
