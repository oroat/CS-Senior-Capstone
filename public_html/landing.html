<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>CoolSys</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="js/search.js"></script>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/search.css">
        <link rel="stylesheet" href="css/popup.css">

        <!-- PRIMARY BLUE: 0758A5 -->
        <!-- PRIMARY RED: BE1E2D -->
        <!-- BACKGROUND COLOR: E7F3FE -->
         
    </head>
    <body>

        <div id="header"></div>

        <div class="row" id="login-prompt" style="display: inherit">
            <div class="col-3 container text-center rounded" style=" margin: 20px">
                <h1 style="color: white">
                    <a href="login.html">Login Here</a>
                </h1>
            </div>
        </div>

        <div class="row" id="data-search" style="display: none">

            <div class="col-3 container rounded" style="margin: 20px; margin-left: 30px; background-color:#b8e5ff !important;">
                <h1 class="display-6">Search for Tool</h1>
                <div class="search-select-wrapper">
                    <input type="text" class="form-control" id="toolSearch" placeholder="Search by serial number" autocomplete="off" style="margin-bottom: 5px" required
                        oninput="filterList('toolSearch','toolList','toolBadge', 'selectedToolId',allTools,'serialNum', selectTool)"
                        onfocus="openList('toolList')" onblur="closeListDelayed('toolList')">
                    <ul class="search-dropdown-list" id="toolList"></ul>
                </div>
                <span class="selected-badge" id="toolBadge" style="display:none;"></span>
                <input type="hidden" id="selectedToolId">

                <div class="text-center"style="margin: 10px">
                    <button class="btn btn-info" onclick="createPopup('selectedToolId', 'tool')">Open Popup</button>
                    <button class="btn btn-outline-secondary ms-2" onclick="clearSearch(['toolSearch', 'selectedToolId'], ['toolBadge'])">Clear</button>
                </div>
            </div>

            <div class="col-4  container rounded" style="margin: 20px; background-color:#b8e5ff !important;">
                <h1 class="display-6">Search for Project</h1>
                <div class="search-select-wrapper">
                    <input type="text" class="form-control" id="projectSearch" placeholder="Search by name" autocomplete="off" style="margin-bottom: 5px" required
                        oninput="filterList('projectSearch','projectList','projectBadge', 'selectedProjectId',allProjects,'name', selectProject)"
                        onfocus="openList('toolList')" onblur="closeListDelayed('toolList')">
                    <ul class="search-dropdown-list" id="projectList"></ul>
                </div>
                <span class="selected-badge" id="projectBadge" style="display:none;"></span>
                <input type="hidden" id="selectedProjectId">

                <div class="text-center"style="margin: 10px">
                    <button class="btn btn-info" onclick="createPopup('selectedProjectId', 'project')">Open Popup</button>
                    <button class="btn btn-outline-secondary ms-2" onclick="clearSearch(['projectSearch', 'selectedProjectId'], ['projectBadge'])">Clear</button>
                </div>
            </div>

            <div class="col-3  container rounded" style="margin: 20px; background-color:#b8e5ff !important;">
                <h1 class="display-6">Search for User</h1>
                <div class="search-select-wrapper">
                    <input type="text" class="form-control" id="userSearch" placeholder="Search by email" autocomplete="off" style="margin-bottom: 5px" required
                        oninput="filterList('userSearch','userList','userBadge', 'selectedUserId',allUsers,'email', selectUser)"
                        onfocus="openList('userList')" onblur="closeListDelayed('userList')">
                    <ul class="search-dropdown-list" id="userList"></ul>
                </div>
                <span class="selected-badge" id="userBadge" style="display:none;"></span>
                <input type="hidden" id="selectedUserId">

                <div class="text-center"style="margin: 10px">
                    <button class="btn btn-info" onclick="createPopup('selectedUserId', 'user')">Open Popup</button>
                    <button class="btn btn-outline-secondary ms-2" onclick="clearSearch(['userSearch', 'selectedUserId'], ['userBadge'])">Clear</button>
                </div>
            </div>

        </div>

        <div class="container">
            <div class="popup" id="popup"></div>
        </div>

       

        <div class="container text-center">
            <img src="images/CoolSys-Logo.png" alt="CoolSys Logo">
        </div>
        

        <div id="footer"></div>

    </body>

    <script>
        $(document).ready(function () {
            $("#header").load('header.html');
            $('#footer').load('footer.html');
        });
    </script>

    <script>
        async function checkLogged(){
            let user;
            try{
                let response = await fetch('/logged');
                user = await response.json();
            } catch (error){
                console.error("Auth check failed", error);
            }

            if (user != null){
                document.getElementById("login-prompt").style.display="none";
                document.getElementById("data-search").style.display="flex";
            }
        }

        checkLogged();
        

    </script>

</html>
